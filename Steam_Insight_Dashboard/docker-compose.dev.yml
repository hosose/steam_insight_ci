services:
  frontend:
    build:
      context: ./app/web-html
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./app/web-html:/app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      WATCHPACK_POLLING: "true"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./app/was
      target: dev
    ports:
      - "4000:4000"
    volumes:
      - ./app/was:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      STEAM_API_KEY: ${STEAM_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
